services:
  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://trendforge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/trendforge
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trendforge
      POSTGRES_DB: trendforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendforge -d trendforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
volumes:
  postgres-data:
