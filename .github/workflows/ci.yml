name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Python lint, format, types and tests
        working-directory: backend
        run: |
          ruff check trendforge tests ../scripts
          ruff format --check trendforge tests ../scripts
          mypy --config-file pyproject.toml trendforge
          pytest -q --cov=trendforge --cov-report=xml
      - name: Install and check frontend
        working-directory: frontend
        run: |
          npm ci --no-audit
          npm run lint
          npm run typecheck
          npm run build
      - name: Seed reproducible demo
        run: python -m trendforge demo
      - name: Desktop and Android browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Repository and Docker validation
        run: |
          python scripts/verify_repository.py
          docker compose config --quiet
          docker compose build
      - name: Preserve browser failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures
          path: frontend/test-results
          retention-days: 7
