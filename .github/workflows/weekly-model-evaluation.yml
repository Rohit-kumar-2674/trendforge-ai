name: Weekly model evaluation
on:
  schedule:
    - cron: '47 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: trendforge-persistent-state
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.event.repository.private || vars.TRENDFORGE_DEMO_MODE != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MODE: ${{ vars.TRENDFORGE_DEMO_MODE || 'true' }}
      DATABASE_URL: sqlite:///./data/trendforge.db
      EVALUATION_ENTITY: ${{ vars.EVALUATION_ENTITY || 'demo:smart-glasses' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend
      - name: Restore cumulative state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_workflow_state.py
      - name: Evaluate without automatic promotion
        run: |
          mkdir -p evaluation
          python -m trendforge evaluate "$EVALUATION_ENTITY" --horizon 7 > evaluation/baseline.json
          python -m trendforge evaluate "$EVALUATION_ENTITY" --horizon 7 --ensemble > evaluation/ensemble.json
          python -m trendforge track-record > evaluation/prospective.json
      - uses: actions/upload-artifact@v7
        with:
          name: trendforge-evaluation
          path: evaluation/
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: trendforge-state
          path: data/trendforge.db
          retention-days: 90
          if-no-files-found: error
